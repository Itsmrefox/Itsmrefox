<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280"
     role="img" aria-label="Animated data visualisation: bars rising and falling above a glowing baseline">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B2E"/>
      <stop offset="100%" stop-color="#14121C"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="280" rx="18" fill="url(#bg)"/>

  <!-- ── faint grid ─────────────────────────────────────────────── -->
  <g stroke="#64748B" stroke-opacity="0.2" stroke-width="1">
    <line x1="28" y1="92"  x2="292" y2="92"/>
    <line x1="28" y1="141" x2="292" y2="141"/>
    <line x1="28" y1="190" x2="292" y2="190"/>
  </g>

  <!-- ── "live" indicator ───────────────────────────────────────── -->
  <g transform="translate(40,40)">
    <circle r="4" fill="#A855F7" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="none" stroke="#A855F7" stroke-width="1.5">
      <animate attributeName="r" values="4;13" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <g fill="#64748B" fill-opacity="0.75">
      <rect x="18" y="-6" width="52" height="4" rx="2"/>
      <rect x="18" y="2"  width="34" height="4" rx="2"/>
    </g>
  </g>

  <!-- ── rising data particles ──────────────────────────────────── -->
  <g fill="#A855F7">
    <circle cx="72" cy="0" r="2.4">
      <animate attributeName="cy" values="206;88" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="0" r="2.4">
      <animate attributeName="cy" values="206;88" dur="4.8s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0" dur="4.8s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="248" cy="0" r="2.4">
      <animate attributeName="cy" values="206;88" dur="4.8s" begin="-3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0" dur="4.8s" begin="-3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ── animated bars (a travelling wave via negative begin) ───── -->
  <g fill="url(#bar)">
    <rect x="48" width="24" rx="5">
      <animate attributeName="height" values="42;112;58;96;42" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="198;128;182;144;198" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="88" width="24" rx="5">
      <animate attributeName="height" values="42;112;58;96;42" dur="4s" begin="-0.65s" repeatCount="indefinite"/>
      <animate attributeName="y" values="198;128;182;144;198" dur="4s" begin="-0.65s" repeatCount="indefinite"/>
    </rect>
    <rect x="128" width="24" rx="5">
      <animate attributeName="height" values="42;112;58;96;42" dur="4s" begin="-1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="198;128;182;144;198" dur="4s" begin="-1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="168" width="24" rx="5">
      <animate attributeName="height" values="42;112;58;96;42" dur="4s" begin="-1.95s" repeatCount="indefinite"/>
      <animate attributeName="y" values="198;128;182;144;198" dur="4s" begin="-1.95s" repeatCount="indefinite"/>
    </rect>
    <rect x="208" width="24" rx="5">
      <animate attributeName="height" values="42;112;58;96;42" dur="4s" begin="-2.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="198;128;182;144;198" dur="4s" begin="-2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="248" width="24" rx="5">
      <animate attributeName="height" values="42;112;58;96;42" dur="4s" begin="-3.25s" repeatCount="indefinite"/>
      <animate attributeName="y" values="198;128;182;144;198" dur="4s" begin="-3.25s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ── glowing baseline + scanning highlight ──────────────────── -->
  <line x1="28" y1="240" x2="292" y2="240" stroke="#A855F7" stroke-width="2"
        stroke-opacity="0.9" filter="url(#glow)"/>
  <circle cy="240" r="3.5" fill="#A855F7" filter="url(#glow)">
    <animate attributeName="cx" values="28;292;28" dur="6s" repeatCount="indefinite"/>
  </circle>

</svg>
